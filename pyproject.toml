[project]
name = "salin"
version = "0.1.0"
description = "A Python library that makes it easy to download any YouTube subtitle in any available format."
readme = "README.md"
license = "MIT"
authors = [{ name = "krvspacetime", email = "krv.becinal@gmail.com" }]
requires-python = ">=3.12"
keywords = ["youtube", "subtitles", "captions", "transcripts", "yt-dlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["yt-dlp[default]>=2026.3.17"]

[project.urls]
Homepage = "https://github.com/krvspacetime/yt-subs"
Repository = "https://github.com/krvspacetime/yt-subs"
Issues = "https://github.com/krvspacetime/yt-subs/issues"

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.15", "ty>=0.0.42"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["salin"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
