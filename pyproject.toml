[project]
name = "salin"
version = "0.1.1"
description = "Typed Python client for YouTube subtitles: inspect, resolve, download, fetch in memory, and clean caption tracks."
readme = "README.md"
license = "MIT"
authors = [{ name = "krvspacetime", email = "krv.becinal@gmail.com" }]
requires-python = ">=3.12"
keywords = [
    "youtube",
    "subtitles",
    "captions",
    "transcripts",
    "subtitle-downloader",
    "transcript-api",
    "webvtt",
    "srt",
    "vtt",
    "yt-dlp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
dependencies = ["yt-dlp[default]>=2026.3.17"]

[project.urls]
Homepage = "https://github.com/krvspacetime/salin"
Repository = "https://github.com/krvspacetime/salin"
Issues = "https://github.com/krvspacetime/salin/issues"

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.15", "ty>=0.0.42"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["salin"]

[tool.hatch.build.targets.sdist]
# Keep local-only directories (bench/, yt-subs-dev/, ADVICE.md) out of the
# sdist. Hatchling selects files through git, which honors .git/info/exclude,
# so an untracked local directory would otherwise be packaged and published.
include = [
    "/salin",
    "/tests",
    "/assets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
